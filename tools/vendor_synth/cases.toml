[[cases]]
name = "crw_crw_8to32"
kind = "entity"
entity = "lm_mem_ram_crw_crw"
description = "True dual port, two writers, port A 8 x 4096, port B 32 bits."
generics = { g_ram_a_data_w = 8, g_ram_a_depth = 4096, g_ram_b_data_w = 32, g_ram_a_latency = 1, g_ram_b_latency = 1 }

[[cases]]
name = "crw_crw_32x1000"
kind = "entity"
entity = "lm_mem_ram_crw_crw"
description = "True dual port, two writers, depth that is not a power of two."
generics = { g_ram_a_data_w = 32, g_ram_a_depth = 1000, g_ram_b_data_w = 32, g_ram_a_latency = 1, g_ram_b_latency = 1 }

[[cases]]
name = "crw_crw_16x64"
kind = "entity"
