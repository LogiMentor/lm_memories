#
# File manifest of lm_memories. Every synthesis and simulation script reads the
# file list of a flow from here; nothing else decides which file is compiled.
#
# - [filesets.<name>]: files in compile order, all in library "work".
#   check  = how the files are checked (python -m tools.manifest check):
#            "ghdl-93-08"   GHDL analysis with --std=93c and --std=08
#            "ghdl-08"      GHDL analysis with --std=08 (testbench code)
#            "ghdl-relaxed" GHDL analysis with --std=08 -frelaxed
#            "target-tool"  only the tools in `tools` analyze the files; they
#                           are verified by synthesis and post-synthesis
#                           simulation
#            "vunit"        analyzed by the VUnit runner (needs vunit_lib)
#   tools  = optional; the only tools allowed to read the file set.
# - [flows.<name>]: ordered list of file sets.
#
# lm_mem_ram_crw_crw is a dual-model entity (docs/PLAN.md section 3.1): the
# entity is in the "core" file set, and each flow picks one architecture,
# all named a_rtl: crw_crw_sim (simulation reference model), crw_crw_amd
# (Vivado only), or crw_crw_unsupported (stops synthesis). lm_mem_ram_rw_rw
# and lm_mem_ram_crw_cw wrap it and follow the same choice.

version = 1

[filesets.common]
check = "ghdl-93-08"
files = [
  "src/common/lm_mem_pkg.vhd",
  "src/common/lm_mem_ccd_resync.vhd",
]

[filesets.core]
check = "ghdl-93-08"
files = [
  "src/core/lm_mem_ram_sdp.vhd",
  "src/core/lm_mem_ram_tdp1w.vhd",
  "src/core/lm_mem_ram_crw_crw_ent.vhd",
]

# Simulation architecture of lm_mem_ram_crw_crw (reference model, uses now).
[filesets.crw_crw_sim]
check = "ghdl-93-08"
files = [
  "src/sim/lm_mem_ram_crw_crw_rtl.vhd",
]

# Vivado architecture of lm_mem_ram_crw_crw (UG901 template, plain shared
# variable). Verified by synthesis and post-synthesis simulation.
[filesets.crw_crw_amd]
check = "target-tool"
tools = ["vivado"]
files = [
  "src/vendor/amd/lm_mem_ram_crw_crw_rtl.vhd",
]

# Fallback architecture: stops elaboration for tools without a validated
# two-writer architecture.
[filesets.crw_crw_unsupported]
check = "ghdl-93-08"
files = [
  "src/vendor/unsupported/lm_mem_ram_crw_crw_rtl.vhd",
]

[filesets.wrappers]
check = "ghdl-93-08"
files = [
  "src/generic/lm_mem_ram_r_w.vhd",
  "src/generic/lm_mem_ram_cr_cw.vhd",
  "src/generic/lm_mem_ram_r_w_ratio.vhd",
  "src/generic/lm_mem_ram_cr_cw_ratio.vhd",
  "src/generic/lm_mem_ram_crw_cr.vhd",
  "src/generic/lm_mem_ram_rw_rw.vhd",
  "src/generic/lm_mem_ram_crw_cw.vhd",
]

[filesets.inference]
check = "ghdl-93-08"
files = [
  "src/inference/lm_mem_ram_r_w_infer.vhd",
]

[filesets.fifo]
check = "ghdl-93-08"
files = [
  "src/fifo/lm_mem_fifo.vhd",
  "src/fifo/lm_mem_fifo_sync.vhd",
  "src/fifo/lm_mem_fifo_async.vhd",
]

# Deprecated: these wrappers do not instantiate vendor primitives.
[filesets.primitives]
check = "ghdl-93-08"
files = [
  "src/primitives/xilinx/lm_mem_xilinx_ram_r_w_prim.vhd",
  "src/primitives/intel/lm_mem_intel_ram_r_w_prim.vhd",
  "src/primitives/lattice/lm_mem_lattice_ram_r_w_prim.vhd",
  "src/primitives/microchip/lm_mem_microchip_ram_r_w_prim.vhd",
]

[filesets.sim_ref]
check = "ghdl-08"
files = [
  "sim/ref/lm_mem_ref_ram_crw_crw.vhd",
]

[filesets.tb_legacy]
check = "ghdl-08"
files = [
  "sim/tb/tb_lm_mem_ram_rw_rw.vhd",
  "sim/tb/tb_lm_mem_ram_r_w_infer.vhd",
  "sim/tb/tb_lm_mem_ram_r_w_primitives.vhd",
  "sim/tb/tb_lm_mem_fifo_sync.vhd",
  "sim/tb/tb_lm_mem_fifo_async.vhd",
]

[filesets.tb_pkg]
check = "ghdl-08"
files = [
  "sim/vunit/lm_mem_tb_pkg.vhd",
]

# DUT adapter, "rtl" architecture (library entities). The post-synthesis flow
# replaces it with a generated adapter that instantiates netlists.
[filesets.tb_dut]
check = "ghdl-08"
files = [
  "sim/vunit/lm_mem_tb_dut.vhd",
]

[filesets.tb_harness]
check = "ghdl-08"
files = [
  "sim/vunit/lm_mem_tb_harness.vhd",
]

# Top-level for simulators without VUnit (xsim): one configuration per run,
# set with generics.
[filesets.tb_plain]
check = "ghdl-08"
files = [
  "sim/vunit/tb_lm_mem_ram_plain.vhd",
]

[filesets.tb_vunit]
check = "vunit"
files = [
  "sim/vunit/tb_lm_mem_ram.vhd",
  "sim/vunit/tb_lm_mem_fifo.vhd",
]

# Library sources for simulation.
[flows.sim]
filesets = ["common", "core", "crw_crw_sim", "wrappers", "inference", "fifo", "primitives"]

# Library sources for synthesis, per vendor. Only AMD has a validated
# two-writer architecture; the others get the fallback.
[flows.synth-amd]
filesets = ["common", "core", "crw_crw_amd", "wrappers", "inference", "fifo", "primitives"]

[flows.synth-intel]
filesets = ["common", "core", "crw_crw_unsupported", "wrappers", "inference", "fifo", "primitives"]

[flows.synth-lattice]
filesets = ["common", "core", "crw_crw_unsupported", "wrappers", "inference", "fifo", "primitives"]

[flows.synth-microchip]
filesets = ["common", "core", "crw_crw_unsupported", "wrappers", "inference", "fifo", "primitives"]

# The fallback flow, for checking with any tool that synthesis stops
# (tools/vendor_synth/fallback_check.toml).
[flows.synth-unsupported]
filesets = ["common", "core", "crw_crw_unsupported", "wrappers", "inference", "fifo", "primitives"]

# Existing self-checking testbenches (sim/scripts/run_ghdl.py).
[flows.test-legacy]
filesets = ["common", "core", "crw_crw_sim", "wrappers", "inference", "fifo", "primitives", "tb_legacy"]

# New VUnit testbenches (sim/vunit/run.py).
[flows.test-vunit]
filesets = ["common", "core", "crw_crw_sim", "wrappers", "inference", "fifo", "primitives",
            "sim_ref", "tb_pkg", "tb_dut", "tb_harness", "tb_vunit"]

# Post-synthesis simulation (sim/scripts/run_postsynth.py): the harness on
# netlists. The script compiles the vendor simulation library, the netlists
# and the generated DUT adapter before the "tb_harness" file set.
[flows.test-postsynth]
filesets = ["common", "sim_ref", "tb_pkg", "tb_harness", "tb_plain"]
