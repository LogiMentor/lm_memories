# Binding of a v0.2.0 component declaration (issue #7): without the reset
# generics and ports, the instance keeps the results of v0.2.0.

[[cases]]
name = "r_w_32x1024_v020_component"
kind = "component_default"
entity = "lm_mem_ram_r_w"
omit_generics = ["g_ram_rst_en"]
omit_ports = ["rd_rst_n_i"]
description = "lm_mem_ram_r_w 32 x 1024 through a component declaration of v0.2.0 (default binding)."
generics = { g_ram_data_w = 32, g_ram_depth = 1024, g_ram_latency = 1 }

[[cases]]
name = "crw_cr_32x1024_v020_component"
kind = "component_default"
entity = "lm_mem_ram_crw_cr"
omit_generics = ["g_ram_a_rst_en", "g_ram_b_rst_en"]
omit_ports = ["rst_a_n_i", "rst_b_n_i"]
description = "lm_mem_ram_crw_cr 32 x 1024 through a component declaration of v0.2.0 (default binding)."
generics = { g_ram_data_w = 32, g_ram_depth = 1024, g_ram_latency = 1 }

