# Expected Vivado synthesis results (out-of-context) for the cases in
# ../cases.toml. A case passes only if every listed field matches.
#
# Fields:
#   bram_tiles     exact number of block RAM tiles (RAMB18 = 0.5)
#   lutram         exact number of LUTs used as memory
#   uram           exact number of URAM blocks
#   max_registers  ceiling on flip-flops (a RAM built from flip-flops needs
#                  depth x width of them)
#   max_luts       ceiling on LUTs used as logic, "LUT as Logic" (optional)
#   max_critical_warnings, forbidden_messages: from [defaults] unless set
#
# Parts: xc7a35tfgg484-2 (7-series), xcku3p-ffva676-2-e (Kintex
# UltraScale+). Expected results cover block RAM only: the cores carry no
# ram_style attribute, so no URAM is expected.

[defaults]
max_critical_warnings = 0
forbidden_messages = ["Synth 8-6859", "Synth 8-5787", "Synth 8-4767"]
uram = 0

[[expect]]
case = "r_w_32x1024"
parts = ["xc7a35tfgg484-2", "xcku3p-ffva676-2-e"]
bram_tiles = 1
lutram = 0
max_registers = 0
max_luts = 0

[[expect]]
case = "r_w_32x1024_lat2"
parts = ["xc7a35tfgg484-2", "xcku3p-ffva676-2-e"]
bram_tiles = 1
lutram = 0
max_registers = 0
max_luts = 0

[[expect]]
case = "r_w_16x64"
parts = ["xc7a35tfgg484-2"]
# 7-series: one RAMB18, output register absorbed.
bram_tiles = 0.5
lutram = 0
max_registers = 0
max_luts = 0

[[expect]]
case = "r_w_16x64"
parts = ["xcku3p-ffva676-2-e"]
# UltraScale+: distributed RAM, 2 x RAM64M8 + 1 x RAM64M = 20 LUTs as memory,
# 16 output flip-flops (asynchronous read + register), 1 LUT for the write
# enable (ena_i and wen_i).
bram_tiles = 0
lutram = 20
max_registers = 16
max_luts = 1

[[expect]]
case = "r_w_32x1000"
parts = ["xc7a35tfgg484-2", "xcku3p-ffva676-2-e"]
bram_tiles = 1
lutram = 0
max_registers = 0
max_luts = 0

