name: ci

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ghdl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GHDL and VUnit
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl
          python -m pip install "vunit_hdl>=4.7,<5"

      - name: Check RTL language level (GHDL --std=93c and --std=08)
        run: python -m tools.manifest check --flow sim --flow test-legacy --flow test-vunit

      - name: Run existing VHDL tests
        run: python sim/scripts/run_ghdl.py

      - name: Run VUnit tests
        run: python sim/vunit/run.py -p 2 --xunit-xml vunit_results.xml

      - name: Upload VUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vunit-results
          path: vunit_results.xml
          if-no-files-found: ignore

  python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tools/tests
