entity = "lm_mem_ram_r_w"
description = "Small common-clock simple dual port, 16 x 64, read-output reset enabled and driven (distributed RAM on UltraScale+)."
generics = { g_ram_data_w = 16, g_ram_depth = 64, g_ram_latency = 1, g_ram_rst_en = true }

[[cases]]
