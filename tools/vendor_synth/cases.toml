[[cases]]
name = "fifo_sync_32x16"
kind = "entity"
entity = "lm_mem_fifo_sync"
description = "Synchronous FIFO, library defaults (32 x 16)."
generics = { g_data_w = 32, g_depth = 16 }

[[cases]]
name = "fifo_sync_32x1024"
kind = "entity"
entity = "lm_mem_fifo_sync"
description = "Synchronous FIFO, 32 x 1024."
