[run]
work_root = "build/vendor_synth"

[[targets]]
name = "vivado-zynq7-local"
tool = "vivado"
enabled = false
vendor = "xilinx"
family = "zynq7"
part = "xc7z010clg400-1"
executable = "C:/Xilinx/Vivado/2023.1/bin/vivado.bat"
cases = [
  "generic_r_w_32x1024",
  "generic_rw_rw_32x1024",
  "generic_crw_crw_32x1024",
  "infer_r_w_bram_32x1024",
  "infer_r_w_distributed_16x64",
  "primitive_r_w_block_32x1024",
]
timeout_seconds = 3600

[[targets]]
name = "quartus-cyclone10-local"
tool = "quartus"
enabled = false
vendor = "intel"
family = "Cyclone 10 LP"
device = "10CL025YU256C8G"
executable = "C:/intelFPGA_lite/24.1/quartus/bin64/quartus_sh.exe"
cases = [
  "generic_r_w_32x1024",
  "generic_rw_rw_32x1024",
  "generic_crw_crw_32x1024",
  "infer_r_w_bram_32x1024",
  "infer_r_w_distributed_16x64",
  "primitive_r_w_block_32x1024",
]
timeout_seconds = 3600

[[targets]]
name = "diamond-ecp5-local"
tool = "diamond"
enabled = false
vendor = "lattice"
family = "ecp5"
device = "LFE5U-45F-6BG381C"
executable = "C:/lscc/diamond/3.13/bin/nt64/diamondc.exe"
cases = [
  "generic_r_w_32x1024",
  "generic_rw_rw_32x1024",
  "generic_crw_crw_32x1024",
  "infer_r_w_bram_32x1024",
  "infer_r_w_distributed_16x64",
  "primitive_r_w_block_32x1024",
]
timeout_seconds = 3600
