kind = "entity"
entity = "lm_mem_ram_r_w_ratio"
description = "Wrong generics: read-output reset enabled with a read port wider than the write port."
generics = { g_ram_a_data_w = 8, g_ram_a_depth = 4096, g_ram_b_data_w = 32, g_ram_b_rst_en = true }
