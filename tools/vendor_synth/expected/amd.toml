# FIFOs: the storage must be a RAM primitive; the registers are the pointers,
# flags and synchronizers (a flip-flop storage would need 512 or 32768).
[[expect]]
case = "fifo_sync_32x16"
parts = ["xc7a35tfgg484-2"]
# Distributed RAM: 5 x RAM32M (6 bits each) + 2 x RAM32X1D = 24 LUTs as memory.
bram_tiles = 0
lutram = 24
max_registers = 120

[[expect]]
case = "fifo_sync_32x16"
parts = ["xcku3p-ffva676-2-e"]
# Distributed RAM: 2 x RAM32M16 (14 bits, 8 LUTs each) + 1 x RAM32M = 20 LUTs as memory.
bram_tiles = 0
lutram = 20
max_registers = 120

[[expect]]
case = "fifo_sync_32x1024"
parts = ["xc7a35tfgg484-2", "xcku3p-ffva676-2-e"]
bram_tiles = 1
lutram = 0
max_registers = 200

[[expect]]
case = "fifo_async_32x16"
parts = ["xc7a35tfgg484-2"]
# Distributed RAM: 5 x RAM32M (6 bits each) + 2 x RAM32X1D = 24 LUTs as memory.
bram_tiles = 0
lutram = 24
max_registers = 120

[[expect]]
case = "fifo_async_32x16"
parts = ["xcku3p-ffva676-2-e"]
# Distributed RAM: 2 x RAM32M16 (14 bits, 8 LUTs each) + 1 x RAM32M = 20 LUTs as memory.
bram_tiles = 0
lutram = 20
max_registers = 120

[[expect]]
case = "fifo_async_32x1024"
parts = ["xc7a35tfgg484-2", "xcku3p-ffva676-2-e"]
