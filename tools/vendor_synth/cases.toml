description = "Common-clock simple dual port, 32 x 1024, latency 2, read-output reset enabled and driven."
generics = { g_ram_data_w = 32, g_ram_depth = 1024, g_ram_latency = 2, g_ram_rst_en = true }

[[cases]]
name = "r_w_32x1536_rst"
kind = "entity"
entity = "lm_mem_ram_r_w"
description = "32 x 1536 (storage 2048 words, two block RAMs), read-output reset enabled and driven."
generics = { g_ram_data_w = 32, g_ram_depth = 1536, g_ram_latency = 1, g_ram_rst_en = true }

[[cases]]
name = "r_w_16x64_rst"
