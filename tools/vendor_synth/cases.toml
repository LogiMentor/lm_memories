# Fallback architecture (src/vendor/unsupported): synthesis must stop. Used by
# fallback_check.toml with the synth-unsupported flow.

[[cases]]
name = "fallback_crw_crw_32x1024"
kind = "entity"
entity = "lm_mem_ram_crw_crw"
description = "Fallback architecture: synthesis must stop with the fallback message."
generics = { g_ram_a_data_w = 32, g_ram_a_depth = 1024, g_ram_b_data_w = 32, g_ram_a_latency = 1, g_ram_b_latency = 1 }

[[cases]]
name = "fallback_rw_rw_32x1024"
kind = "entity"
entity = "lm_mem_ram_rw_rw"
description = "Fallback architecture through lm_mem_ram_rw_rw: synthesis must stop."
generics = { g_ram_data_w = 32, g_ram_depth = 1024, g_ram_latency = 1 }

[[cases]]
name = "fallback_crw_cw_32x1024"
kind = "entity"
entity = "lm_mem_ram_crw_cw"
description = "Fallback architecture through lm_mem_ram_crw_cw: synthesis must stop."
generics = { g_ram_data_w = 32, g_ram_depth = 1024, g_ram_latency = 1 }

# Wrong generics: synthesis must stop at the static check (assertion plus a
# constant outside its range, lm_mem_pkg). Expected results name the check.

[[cases]]
name = "bad_r_w_latency3"
kind = "entity"
entity = "lm_mem_ram_r_w"
description = "Wrong generic: read latency 3."
generics = { g_ram_data_w = 32, g_ram_depth = 1024, g_ram_latency = 3 }

[[cases]]
name = "bad_r_w_ratio_24to8"
kind = "entity"
entity = "lm_mem_ram_r_w_ratio"
description = "Wrong generics: width ratio 3 (not a power of two)."
generics = { g_ram_a_data_w = 24, g_ram_a_depth = 1024, g_ram_b_data_w = 8 }

[[cases]]
name = "bad_crw_cr_latency3"
kind = "entity"
entity = "lm_mem_ram_crw_cr"
description = "Wrong generic: latency 3 on the one-writer true dual port."
generics = { g_ram_data_w = 32, g_ram_depth = 1024, g_ram_latency = 3 }

[[cases]]
name = "bad_crw_crw_latency3"
kind = "entity"
entity = "lm_mem_ram_crw_crw"
description = "Wrong generic: port B latency 3 on the two-writer RAM."
generics = { g_ram_a_data_w = 32, g_ram_a_depth = 1024, g_ram_b_data_w = 32, g_ram_a_latency = 1, g_ram_b_latency = 3 }

[[cases]]
name = "bad_crw_crw_ratio_24to8"
kind = "entity"
entity = "lm_mem_ram_crw_crw"
description = "Wrong generics: width ratio 3 on the two-writer RAM."
generics = { g_ram_a_data_w = 24, g_ram_a_depth = 1024, g_ram_b_data_w = 8, g_ram_a_latency = 1, g_ram_b_latency = 1 }

[[cases]]
name = "bad_fifo_sync_depth24"
kind = "entity"
entity = "lm_mem_fifo_sync"
description = "Wrong generic: FIFO depth 24 (not a power of two)."
generics = { g_data_w = 32, g_depth = 24 }

# 36 x 4096 on one clock: on UltraScale+ Vivado chooses URAM without an
# attribute (Synth 8-6794). The crw_cr case ties both clock ports to one
# clock in a generated top (a URAM has a single clock).

[[cases]]
name = "r_w_36x4096"
kind = "entity"
entity = "lm_mem_ram_r_w"
description = "Common-clock simple dual port, 36 x 4096 (URAM on UltraScale+)."
generics = { g_ram_data_w = 36, g_ram_depth = 4096, g_ram_latency = 1 }

[[cases]]
name = "crw_cr_36x4096_cc"
kind = "crw_cr_common_clock"
description = "lm_mem_ram_crw_cr, 36 x 4096, both clock ports on one clock (URAM on UltraScale+)."
generics = { g_ram_data_w = 36, g_ram_depth = 4096, g_ram_latency = 1 }

[[cases]]
name = "rw_rw_36x4096"
kind = "entity"
entity = "lm_mem_ram_rw_rw"
description = "Common-clock true dual port with two writers, 36 x 4096."
generics = { g_ram_data_w = 36, g_ram_depth = 4096, g_ram_latency = 1 }
