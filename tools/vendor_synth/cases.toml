# 36 x 4096 on one clock: on UltraScale+ Vivado chooses URAM without an
# attribute (Synth 8-6794). The crw_cr case ties both clock ports to one
# clock in a generated top (a URAM has a single clock).

[[cases]]
name = "r_w_36x4096"
kind = "entity"
entity = "lm_mem_ram_r_w"
description = "Common-clock simple dual port, 36 x 4096 (URAM on UltraScale+)."
generics = { g_ram_data_w = 36, g_ram_depth = 4096, g_ram_latency = 1 }

[[cases]]
name = "crw_cr_36x4096_cc"
kind = "crw_cr_common_clock"
description = "lm_mem_ram_crw_cr, 36 x 4096, both clock ports on one clock (URAM on UltraScale+)."
generics = { g_ram_data_w = 36, g_ram_depth = 4096, g_ram_latency = 1 }

[[cases]]
name = "rw_rw_36x4096"
kind = "entity"
entity = "lm_mem_ram_rw_rw"
description = "Common-clock true dual port with two writers, 36 x 4096."
generics = { g_ram_data_w = 36, g_ram_depth = 4096, g_ram_latency = 1 }

# Read-output reset (issue #7): enabled by its generic, and the reset ports are
# ports of the out-of-context top, so they are driven. Expected results
# (expected/amd.toml): those of the same case without the reset, plus exactly
# one LUT per reset port that drives the reset pins of the memory (block RAM
# latency 1: RSTRAM; latency 2: RSTRAM and RSTREG; URAM: RST; distributed
# RAM: the R pins of the output flip-flops).

[[cases]]
name = "r_w_32x1024_rst"
kind = "entity"
entity = "lm_mem_ram_r_w"
description = "Common-clock simple dual port, 32 x 1024, latency 1, read-output reset enabled and driven."
generics = { g_ram_data_w = 32, g_ram_depth = 1024, g_ram_latency = 1, g_ram_rst_en = true }

[[cases]]
name = "r_w_32x1024_lat2_rst"
kind = "entity"
